OUTPUTDIR="$HOME/muziek"                                                            # Bibliotheekmap
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM}. ${ARTISTFILE} - ${TRACKFILE}' # Artiest/Album/Tracknummer. Artiest - Titel
OUTPUTTYPE=mp3                                                                      # Audioformaat
INTERACTIVE=n                                                                       # Geen interactieve vragen
EJECTCD=y                                                                           # Uitwerpen na het uitlezen van de audio
LAMEOPTS='-V 2'                                                                     # Variabele bitrate, kwaliteitsniveau 2
mungefilename() {                                                                   # Escape verboden karakters in bestandsnamen, vervang '_' met ' '
    printf '%s\n' "$@" |
        sed 's|[<>:"/\\?*]|_|g; s/[. ]*$//'
}

# abcde hook die na rippen kleine kwaliteitscontrole doet en als die slaagt het disc-info.json bestand in de albummap zet
post_encode() (
    if [ "${METADATA_ONLY:-n}" = "y" ]; then
        exit 0
    fi

    ALBUMFILE="$(mungealbumname "$DALBUM")"
    ARTISTFILE="$(mungeartistname "$TRACKARTIST")"

    if [ "$VARIOUSARTISTS" = "y" ]; then
        format="$(dirname "$VAOUTPUTFORMAT")"
    else
        format="$(dirname "$OUTPUTFORMAT")"
    fi

    album_dir="$OUTPUTDIR/$(eval echo \""$format"\")"
    printf 'Albummap: %s\n' "$album_dir"

    if [ -f "$ABCDETEMPDIR/errors" ]; then
        printf '%s\n' 'Rip bevat fouten; disc-info.json wordt niet geschreven.' >&2
        exit 1
    fi

    if ! tracks=$(printf '%s\n' "${TOC_OUTPUT:?TOC_OUTPUT ontbreekt}" |
        jq -er '.tracks[].number'); then
        printf '%s\n' 'Cd-informatie ontbreekt of bevat geen leesbare tracklijst; disc-info.json wordt niet geschreven.' >&2
        exit 1
    fi

    for track in $tracks; do
        track_number=$(printf '%02d' "$track")
        if ! checkstatus "movetrack-$track_number" >/dev/null; then
            printf 'Track %s is niet geplaatst; disc-info.json wordt niet geschreven.\n' "$track" >&2
            exit 1
        fi
    done

    if ! compgen -G "$album_dir/*.mp3" >/dev/null; then
        printf 'Geen mp3-bestanden gevonden in %s; disc-info.json wordt niet geschreven.\n' "$album_dir" >&2
        exit 1
    fi

    printf '%s\n' "$TOC_OUTPUT" > "$album_dir/disc-info.json" || exit 1
    printf 'Cd-informatie opgeslagen in %s/disc-info.json\n' "$album_dir"
    ls -alsh "$album_dir"
)
